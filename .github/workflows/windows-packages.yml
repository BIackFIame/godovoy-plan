name: Проверка Windows-пакетов выпуска
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Тег опубликованного выпуска
        required: true
        default: v0.6.6
      architecture:
        description: Архитектура пакета
        type: choice
        default: all
        options: [all, x64, x86, ARM64]
      draft_id:
        description: Числовой ID черновика для проверки до выпуска
        type: string
        required: false
      source_sha:
        description: Полный хеш исходного коммита выбранного черновика
        type: string
        required: false
      renderer_run:
        description: Необязательный ID успешной проверки уже собранных драйверов
        type: string
        required: false
      renderer_commit:
        description: Точный хеш проверенной сборки драйверов
        type: string
        required: false
permissions: {}
jobs:
  draft:
    if: inputs.draft_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Получить четыре проверенных архива выбранного черновика
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_ID: ${{ inputs.draft_id }}
          TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$DRAFT_ID" =~ ^[0-9]+$ && "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          api="repos/$GITHUB_REPOSITORY/releases"
          gh api "$api/$DRAFT_ID" > "$RUNNER_TEMP/metadata.json"
          jq -e --arg tag "$TAG" --arg sha "$SOURCE_SHA" '.draft == true and .tag_name == $tag and .target_commitish == $sha' "$RUNNER_TEMP/metadata.json" >/dev/null
          destination="$RUNNER_TEMP/windows-input"
          mkdir "$destination"
          cd "$destination"
          jq '{tag_name,draft,assets:[.assets[]|{name,size,digest,id,state}]}' "$RUNNER_TEMP/metadata.json" > release.json
          for suffix in Plan-Windows-x64 Plan-Windows-x86 Plan-Windows-ARM64 Server-Windows-x64; do
            product="${suffix%%-*}"
            name="Godovoy$product-${TAG#v}-${suffix#*-}.zip"
            row=$(jq -ec --arg name "$name" '[.assets[]|select(.name==$name and .state=="uploaded")]|select(length==1)|.[0]' release.json)
            digest=$(jq -er '.digest' <<< "$row")
            id=$(jq -er '.id|numbers' <<< "$row")
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            gh api "$api/assets/$id" -H 'Accept: application/octet-stream' > "$name"
            echo "${digest#sha256:}  $name" | sha256sum --check --status
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-input/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
  smoke:
    needs: draft
    if: ${{ !cancelled() && (needs.draft.result == 'success' || needs.draft.result == 'skipped') }}
    permissions:
      actions: read
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.architecture == 'all' && '["x64","x86","ARM64"]' || format('["{0}"]', inputs.architecture)) }}
    runs-on: ${{ matrix.arch == 'ARM64' && 'windows-11-arm' || 'windows-2022' }}
    timeout-minutes: 40
    steps:
      - name: Скачать скрипт проверки на текущем коммите
        shell: pwsh
        run: |
          git init --quiet
          git fetch --quiet --no-tags --depth=1 "https://github.com/$env:GITHUB_REPOSITORY.git" $env:GITHUB_SHA
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git checkout --quiet --detach FETCH_HEAD
      - name: Создать отдельный закрытый том NTFS для тестового профиля
        shell: pwsh
        run: ./packaging/windows/test-volume.ps1
      - name: Получить ранее проверенный драйвер нужной архитектуры
        if: inputs.renderer_run != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RENDERER_RUN: ${{ inputs.renderer_run }}
          RENDERER_COMMIT: ${{ inputs.renderer_commit }}
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: ./packaging/windows/reuse-renderer.ps1
      - name: Собрать графический драйвер для виртуальной машины без GPU
        if: inputs.renderer_run == ''
        shell: pwsh
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: ./packaging/windows/test-renderer.ps1 -Arch $env:PACKAGE_ARCH
      - name: Получить проверенные архивы для этой машины
        if: inputs.draft_id != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'windows-input'
          gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name "windows-input-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" --dir $dir
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "GP_PACKAGE_INPUT=$dir" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Проверить пакет на Windows
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: python packaging/windows/smoke.py
      - name: Сохранить проверенный дополнительный рендерер
        if: inputs.renderer_run == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: software-opengl-${{ matrix.arch }}
          path: ${{ env.GP_RENDERER_ARCHIVE }}/*.zip
          compression-level: 0
          retention-days: 10
          if-no-files-found: error
