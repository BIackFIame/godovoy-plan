name: Проверка Windows-пакетов выпуска
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Тег опубликованного выпуска
        required: true
        default: v0.6.6
      architecture:
        description: Архитектура пакета
        type: choice
        default: all
        options: [all, x64, x86, ARM64]
permissions: {}
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.architecture == 'all' && '["x64","x86","ARM64"]' || format('["{0}"]', inputs.architecture)) }}
    runs-on: ${{ matrix.arch == 'ARM64' && 'windows-11-arm' || 'windows-2022' }}
    timeout-minutes: 40
    steps:
      - name: Скачать скрипт проверки на текущем коммите
        shell: pwsh
        run: |
          git init --quiet
          git fetch --quiet --no-tags --depth=1 "https://github.com/$env:GITHUB_REPOSITORY.git" $env:GITHUB_SHA
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git checkout --quiet --detach FETCH_HEAD
      - name: Создать отдельный закрытый том NTFS для тестового профиля
        shell: pwsh
        run: ./packaging/windows/test-volume.ps1
      - name: Собрать графический драйвер для виртуальной машины без GPU
        shell: pwsh
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: ./packaging/windows/test-renderer.ps1 -Arch $env:PACKAGE_ARCH
      - name: Проверить опубликованный пакет на Windows
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: python packaging/windows/smoke.py
