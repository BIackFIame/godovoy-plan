name: Проверка Windows-пакетов выпуска
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Тег опубликованного выпуска
        required: true
        default: v0.6.6
      architecture:
        description: Архитектура пакета
        type: choice
        default: all
        options: [all, x64, x86, ARM64]
      scope:
        description: Проверить только профиль и сервер либо также графический интерфейс
        type: choice
        default: full
        options: [full, profile]
      draft_id:
        description: Числовой ID черновика для проверки до выпуска
        type: string
        required: false
      source_sha:
        description: Полный хеш исходного коммита выбранного черновика
        type: string
        required: false
      draft_renderer_pair:
        description: Использовать два закреплённых QA-архива Mesa из выбранного черновика для полного теста всех архитектур
        type: boolean
        default: false
      renderer_run:
        description: Необязательный ID успешной проверки уже собранных драйверов
        type: string
        required: false
      renderer_commit:
        description: Точный хеш проверенной сборки драйверов
        type: string
        required: false
env:
  MESA_X86_SHA256: b99a5301076b85c6ddd1f7902d0829d6c18db310f2943640199fd91571acf455
  MESA_X64_SHA256: 6052db4fcde9cdcc6baf70d6ab81255264b8b6180398214652d5b91fbb0147c7
permissions: {}
jobs:
  draft:
    if: inputs.draft_id != '' || inputs.draft_renderer_pair
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # GitHub requires push access to read a draft by ID. No project code runs here.
      contents: write
    steps:
      - name: Получить четыре проверенных архива выбранного черновика
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_ID: ${{ inputs.draft_id }}
          TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RENDERER_PAIR: ${{ inputs.draft_renderer_pair }}
          ARCHITECTURE: ${{ inputs.architecture }}
          SCOPE: ${{ inputs.scope }}
          RENDERER_RUN: ${{ inputs.renderer_run }}
          RENDERER_COMMIT: ${{ inputs.renderer_commit }}
        run: |
          set -euo pipefail
          [[ "$DRAFT_ID" =~ ^[0-9]+$ && "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          if [[ "$RENDERER_PAIR" == true ]]; then
            [[ "$ARCHITECTURE" == all && "$SCOPE" == full ]] || exit 1
            if [[ -n "$RENDERER_RUN" || -n "$RENDERER_COMMIT" ]]; then
              [[ "$RENDERER_RUN" =~ ^[0-9]+$ && "$RENDERER_COMMIT" =~ ^[a-f0-9]{40}$ ]] || exit 1
            fi
          fi
          api="repos/$GITHUB_REPOSITORY/releases"
          gh api "$api/$DRAFT_ID" > "$RUNNER_TEMP/metadata.json"
          jq -e --arg tag "$TAG" --arg sha "$SOURCE_SHA" '.draft == true and .tag_name == $tag and .target_commitish == $sha' "$RUNNER_TEMP/metadata.json" >/dev/null
          destination="$RUNNER_TEMP/windows-input"
          mkdir "$destination"
          cd "$destination"
          jq '{tag_name,draft,assets:[.assets[]|{name,size,digest,id,state}]}' "$RUNNER_TEMP/metadata.json" > release.json
          download_asset() {
            local name="$1" expected="${2:-}" row digest id actual
            row=$(jq -ec --arg name "$name" '[.assets[]|select(.name==$name and .state=="uploaded")]|select(length==1)|.[0]' release.json)
            digest=$(jq -er '.digest' <<< "$row")
            id=$(jq -er '.id|numbers' <<< "$row")
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 1
            if [[ -n "$expected" && "$digest" != "sha256:$expected" ]]; then exit 1; fi
            gh api "$api/assets/$id" -H 'Accept: application/octet-stream' > "$name"
            actual=$(sha256sum "$name")
            [[ "${actual%% *}" == "${digest#sha256:}" ]] || exit 1
          }
          for suffix in Plan-Windows-x64 Plan-Windows-x86 Plan-Windows-ARM64 Server-Windows-x64; do
            product="${suffix%%-*}"
            download_asset "Godovoy$product-${TAG#v}-${suffix#*-}.zip"
          done
          if [[ "$RENDERER_PAIR" == true ]]; then
            download_asset Mesa-26.3.1-Softpipe-Windows-x86-local-QA.zip "$MESA_X86_SHA256"
            download_asset Mesa-26.3.1-Softpipe-Windows-x64-local-QA.zip "$MESA_X64_SHA256"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-input/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
  renderer-source:
    if: inputs.scope == 'full' && inputs.renderer_run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Скачать и сверить исходные архивы
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/renderer-source"
          cd "$RUNNER_TEMP/renderer-source"
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 150 -o mesa.tar.xz https://archive.mesa3d.org/mesa-26.3.1.tar.xz
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 60 -o flex.zip https://github.com/lexxmark/winflexbison/releases/download/v2.5.25/win_flex_bison-2.5.25.zip
          echo '4e4e438eac7b840a9383988cbb7c08dad8041da544b9319fc26d319fa7348961  mesa.tar.xz' | sha256sum -c
          echo '8d324b62be33604b2c45ad1dd34ab93d722534448f55a16ca7292de32b6ac135  flex.zip' | sha256sum -c
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: renderer-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/renderer-source/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
  smoke:
    needs: [draft, renderer-source]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    permissions:
      actions: read
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.architecture == 'all' && '["x64","x86","ARM64"]' || format('["{0}"]', inputs.architecture)) }}
    runs-on: ${{ matrix.arch == 'ARM64' && 'windows-11-arm' || 'windows-2022' }}
    timeout-minutes: 60
    steps:
      - name: Скачать скрипт проверки на текущем коммите
        shell: pwsh
        run: |
          git init --quiet
          git fetch --quiet --no-tags --depth=1 "https://github.com/$env:GITHUB_REPOSITORY.git" $env:GITHUB_SHA
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git checkout --quiet --detach FETCH_HEAD
      - name: Создать отдельный закрытый том NTFS для тестового профиля
        shell: pwsh
        run: ./packaging/windows/test-volume.ps1
      - name: Получить ранее проверенный драйвер нужной архитектуры
        if: inputs.scope != 'profile' && inputs.renderer_run != '' && (!inputs.draft_renderer_pair || matrix.arch == 'ARM64')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RENDERER_RUN: ${{ inputs.renderer_run }}
          RENDERER_COMMIT: ${{ inputs.renderer_commit }}
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: ./packaging/windows/reuse-renderer.ps1
      - name: Собрать графический драйвер для виртуальной машины без GPU
        if: inputs.scope != 'profile' && inputs.renderer_run == '' && (!inputs.draft_renderer_pair || matrix.arch == 'ARM64')
        shell: pwsh
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'renderer-source'
          gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name "renderer-source-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" --dir $source
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./packaging/windows/test-renderer.ps1 -Arch $env:PACKAGE_ARCH -Source $source
      - name: Получить проверенные архивы для этой машины
        if: inputs.draft_id != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'windows-input'
          gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name "windows-input-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" --dir $dir
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "GP_PACKAGE_INPUT=$dir" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Проверить и извлечь локальные Softpipe DLL для этой машины
        if: inputs.draft_renderer_pair && matrix.arch != 'ARM64'
        shell: pwsh
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: python packaging/windows/draft-renderer.py
      - name: Проверить пакет на Windows
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GP_TEST_SCOPE: ${{ inputs.scope }}
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: python packaging/windows/smoke.py
      - name: Сохранить проверенный дополнительный рендерер
        if: inputs.scope != 'profile' && inputs.renderer_run == '' && (!inputs.draft_renderer_pair || matrix.arch == 'ARM64')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: software-opengl-${{ matrix.arch }}
          path: ${{ env.GP_RENDERER_ARCHIVE }}/*.zip
          compression-level: 0
          retention-days: 10
          if-no-files-found: error
