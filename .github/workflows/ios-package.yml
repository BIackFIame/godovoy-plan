name: Проверка iOS-проекта выпуска
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Тег опубликованного выпуска
        required: true
        default: v0.6.5
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Проверить и распаковать комплект Xcode
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(uname -m)" = arm64
          name="GodovoyPlan-${TAG#v}-iOS-Xcode.zip"
          expected=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq ".assets[] | select(.name == \"$name\") | .digest")
          [[ "$expected" =~ ^sha256:[a-f0-9]{64}$ ]]
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name"
          echo "${expected#sha256:}  $name" | shasum -a 256 -c -
          ditto -x -k "$name" "$RUNNER_TEMP/package"
      - name: Собрать приложение для устройства без ключа подписи
        run: |
          cd "$RUNNER_TEMP/package/GodovoyPlan-iOS"
          xcodebuild -quiet -project GodovoyPlan.xcodeproj -scheme GodovoyPlan -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/device" CODE_SIGNING_ALLOWED=NO build
      - name: Создать календарь, сохранить событие и открыть его после перезапуска
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/package/GodovoyPlan-iOS"
          # Drive the released app with the regression test from this workflow commit.
          curl --fail --silent --show-error --retry 3 "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/mobile/ios/UITests/CalendarUITests.swift" -o UITests/CalendarUITests.swift
          xcrun simctl list -j devices available > "$RUNNER_TEMP/devices.json"
          phone=$(python3 -c 'import json,sys; data=json.load(open(sys.argv[1]))["devices"]; print(next(d["udid"] for runtime,devices in reversed(list(data.items())) if ".iOS-" in runtime for d in devices if d["name"].startswith("iPhone") and d["isAvailable"]))' "$RUNNER_TEMP/devices.json")
          xcrun simctl bootstatus "$phone" -b
          xcodebuild -project GodovoyPlan.xcodeproj -scheme GodovoyPlan -destination "platform=iOS Simulator,id=$phone" -parallel-testing-enabled NO -only-testing:GodovoyPlanUITests/CalendarUITests/testCreateCalendarAndPersistEvent -resultBundlePath "$RUNNER_TEMP/Calendar.xcresult" test
      - name: Упаковать приложение для симулятора и сборку для корпоративной подписи
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/package/GodovoyPlan-iOS"
          xcodebuild -quiet -project GodovoyPlan.xcodeproj -scheme GodovoyPlan -configuration Release -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/simulator" ARCHS=arm64 build
          mkdir -p "$RUNNER_TEMP/ios-artifacts"
          pack_app() {
            local build="$1" platform="$2" suffix="$3" app
            app=$(find "$build" -maxdepth 1 -type d -name '*.app')
            test -d "$app"
            test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")" = local.godovoyplan.mobile
            test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Info.plist")" = "${TAG#v}"
            test "$(/usr/libexec/PlistBuddy -c 'Print DTPlatformName' "$app/Info.plist")" = "$platform"
            ditto -c -k --keepParent "$app" "$RUNNER_TEMP/ios-artifacts/GodovoyPlan-${TAG#v}-$suffix.zip"
          }
          pack_app "$RUNNER_TEMP/simulator/Build/Products/Release-iphonesimulator" iphonesimulator iOS-Simulator-ARM64
          pack_app "$RUNNER_TEMP/device/Build/Products/Release-iphoneos" iphoneos iOS-Unsigned-Device
          cd "$RUNNER_TEMP/ios-artifacts"
          shasum -a 256 ./*.zip > SHA256SUMS.txt
      - name: Сохранить собранные приложения
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-apps-${{ inputs.tag }}
          path: ${{ runner.temp }}/ios-artifacts/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
