[package]
name = "godovoy-mobile-core"
version = "0.6.4"
edition = "2024"
rust-version = "1.94"
publish = false

[lib]
name = "godovoy_mobile_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
godovoy-plan = { path = "../..", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
